<!-- Modal 1: Live Multi-Portal Verification Simulation -->
<div id="simulationModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">
  <div class="bg-stone-900 border border-rust-500/50 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl text-white">
    
    <!-- Simulation Modal Header -->
    <div class="p-5 border-b border-stone-800 flex items-center justify-between bg-stone-950">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-rust-700 flex items-center justify-center text-white">
          <i class="fa-solid fa-microchip-ai pulse-dot"></i>
        </div>
        <div>
          <h3 class="font-bold text-sm text-white">VECTA Live Multi-Portal Handshake</h3>
          <p class="text-[11px] text-stone-400">Executing automated verification across 12 statutory Government registries...</p>
        </div>
      </div>
      <span id="simProgressPercent" class="font-mono text-sm font-bold text-amber-400">0%</span>
    </div>

    <!-- Animated Progress Bar in Rust -->
    <div class="w-full bg-stone-800 h-2">
      <div id="simProgressBar" class="bg-gradient-to-r from-rust-600 via-amber-500 to-emerald-500 h-2 transition-all duration-300 w-0"></div>
    </div>

    <div class="p-5 space-y-4">
      <div class="flex items-center justify-between text-xs font-mono text-stone-400">
        <span>Active Target: <strong id="simCurrentStage" class="text-white">Connecting...</strong></span>
        <span class="text-emerald-400"><i class="fa-solid fa-shield-halved mr-1"></i>Encrypted SSL Pipeline</span>
      </div>

      <!-- Terminal Console Log -->
      <div id="simLogConsole" class="bg-black/90 p-4 rounded-xl border border-stone-800 h-64 overflow-y-auto font-mono text-xs space-y-1">
        <!-- Injected dynamically by modal-simulation.js -->
      </div>

      <!-- Modal Actions -->
      <div class="flex items-center justify-end pt-2">
        <button id="simCloseBtn" class="px-5 py-2 rounded-xl bg-rust-700 hover:bg-rust-600 text-white font-bold text-xs transition">
          Close & Review Results
        </button>
      </div>
    </div>

  </div>
</div>
