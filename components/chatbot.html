<!-- Floating Multilingual MSME Bidder Chatbot (USP 7) -->
<button id="btnChatbotLauncher" class="chatbot-launcher-btn" title="Ask VECTA Sahayak (MSME AI Guide)">
  <i class="fa-solid fa-comments text-2xl"></i>
</button>

<div id="chatbotModal" class="chatbot-modal">
  <!-- Chatbot Header -->
  <div class="chatbot-header">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-full bg-amber-400 text-slate-900 flex items-center justify-center font-bold text-xs">
        <i class="fa-solid fa-robot"></i>
      </div>
      <div>
        <h4 class="text-xs font-bold text-white">VECTA Sahayak (सहायक)</h4>
        <p class="text-[10px] text-blue-200">MSME Multilingual Guidance Bot</p>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <!-- Language Selector -->
      <select id="chatbotLangSelect" class="bg-blue-900 text-white text-[11px] font-semibold rounded px-1.5 py-0.5 border border-blue-700 outline-none cursor-pointer">
        <option value="en">English</option>
        <option value="hi" selected>हिन्दी</option>
        <option value="mr">मराठी</option>
        <option value="ta">தமிழ்</option>
      </select>
      <button id="btnCloseChatbot" class="text-slate-300 hover:text-white p-1">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>
  </div>

  <!-- Chatbot Message Stream -->
  <div id="chatbotMessages" class="chatbot-body">
    <div class="chat-bubble-bot">
      <p class="font-bold text-blue-950 mb-1">नमस्ते! 🙏</p>
      <p>मैं VECTA सहायक हूँ। अगर आपकी बिड में कोई कमी (deficiency) या दस्तावेज़ mismatch है, तो मैं आपको सरल भाषा में समझाऊंगा और सुधारने की चेकलिस्ट दूंगा।</p>
    </div>
  </div>

  <!-- Quick Prompts -->
  <div class="px-3 py-2 bg-slate-100 border-t border-slate-200 flex gap-1.5 overflow-x-auto text-[10px]">
    <button class="chat-prompt-btn px-2.5 py-1 bg-white hover:bg-blue-50 border border-slate-200 rounded-full font-medium whitespace-nowrap text-slate-700" data-prompt="why_flagged">
      बिड क्यों फ्लैग हुई?
    </button>
    <button class="chat-prompt-btn px-2.5 py-1 bg-white hover:bg-blue-50 border border-slate-200 rounded-full font-medium whitespace-nowrap text-slate-700" data-prompt="how_to_fix">
      कमी कैसे ठीक करें?
    </button>
    <button class="chat-prompt-btn px-2.5 py-1 bg-white hover:bg-blue-50 border border-slate-200 rounded-full font-medium whitespace-nowrap text-slate-700" data-prompt="checklist">
      सुधार चेकलिस्ट
    </button>
  </div>

  <!-- Chat Input -->
  <div class="p-2.5 bg-white border-t border-slate-200 flex gap-2">
    <input type="text" id="chatInput" placeholder="अपना सवाल पूछें..." class="flex-1 text-xs border border-slate-300 rounded-lg px-3 py-1.5 outline-none focus:border-blue-700" />
    <button id="btnSendChat" class="bg-blue-900 hover:bg-blue-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>
</div>
