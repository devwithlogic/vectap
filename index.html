<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VECTA | AI-Powered Integrated Bid Compliance Verification Platform</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              50: '#EFF6FF', 100: '#DBEAFE', 200: '#BFDBFE', 500: '#2563EB',
              700: '#133E87', 800: '#0F3057', 850: '#0B2545', 900: '#081D38', 950: '#051426'
            },
            saffron: {
              50: '#FFFBEB', 100: '#FEF3C7', 300: '#FBBF24', 400: '#F59E0B', 500: '#D97706', 600: '#B45309'
            },
            rust: {
              50: '#EFF6FF', 100: '#DBEAFE', 200: '#BFDBFE', 300: '#93C5FD',
              400: '#2563EB', 500: '#1D4ED8', 600: '#133E87', 700: '#0F3057',
              800: '#0B2545', 900: '#081D38'
            }
          }
        }
      }
    }
  </script>

  <!-- Font Awesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Modular Design System -->
  <link rel="stylesheet" href="styles/rust-theme.css">
</head>
<body class="min-h-screen flex flex-col bg-[#F8FAFC] text-slate-900">

  <!-- 1. Header & Navigation -->
  <div data-component="navbar"></div>

  <!-- 2. Multi-Portal Live Telemetry Ribbon -->
  <div data-component="portal-ribbon"></div>

  <!-- 3. Main Dashboard Workspace -->
  <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <!-- Preface / Hero Banner -->
    <div data-component="preface-hero"></div>

    <!-- Bidder Grid: Directory (Left) + Detail Console (Right) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      <div data-component="sidebar" class="lg:col-span-4"></div>

      <section id="bidderDetail" class="lg:col-span-8 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div data-component="bidder-header"></div>
        <div id="tabContentContainer" class="p-6"></div>
      </section>
    </div>
  </main>

  <!-- 4. Footer -->
  <div data-component="footer"></div>

  <!-- 5. 3-Dot Drawer, Modals & Chatbot -->
  <div data-component="drawer"></div>
  <div data-component="modal-simulation"></div>
  <div data-component="modal-document"></div>
  <div data-component="modal-apply"></div>
  <div data-component="modal-report"></div>
  <div data-component="modal-forgery"></div>
  <div data-component="chatbot"></div>

  <!-- 6. Notifications -->
  <div id="toastContainer" class="fixed bottom-6 right-6 z-50 space-y-2 pointer-events-none"></div>

  <!-- Component Template Loader -->
  <script src="components/component-loader.js"></script>

  <!-- Modular Data Models -->
  <script src="js/data/tender.js"></script>
  <script src="js/data/portals.js"></script>
  <script src="js/data/bidders-qualified.js"></script>
  <script src="js/data/bidders-flagged.js"></script>
  <script src="js/data/bidders.js"></script>
  <script src="js/data/criteria.js"></script>
  <script src="js/data/collusion-data.js"></script>
  <script src="js/data/xai-data.js"></script>
  <script src="js/data/forgery-data.js"></script>
  <script src="js/data/lifecycle-data.js"></script>
  <script src="js/data/chatbot-data.js"></script>
  <script src="js/data/index.js"></script>

  <!-- Modular Services -->
  <script src="js/services/scoring.js"></script>
  <script src="js/services/simulation.js"></script>
  <script src="js/services/report.js"></script>

  <!-- Modular UI Views -->
  <script src="js/ui/toast.js"></script>
  <script src="js/ui/portals-view.js"></script>
  <script src="js/ui/bidder-list-view.js"></script>
  <script src="js/ui/tab-crosscheck.js"></script>
  <script src="js/ui/tab-documents.js"></script>
  <script src="js/ui/tab-checklist.js"></script>
  <script src="js/ui/tab-decision.js"></script>
  <script src="js/ui/tab-audit.js"></script>

  <!-- Modular Modal & USP Controllers -->
  <script src="js/ui/modal-simulation.js"></script>
  <script src="js/ui/modal-document.js"></script>
  <script src="js/ui/modal-apply.js"></script>
  <script src="js/ui/modal-report.js"></script>

  <!-- Main Orchestration -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
